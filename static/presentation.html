<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082923">
  <meta name="description" content="MedTekser жобасының презентациясы: корпоративтік медициналық тексерулерді ұйымдастыруға арналған цифрлық сервис.">
  <title>MedTekser — жоба презентациясы</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f8f6;
      --muted: #b9d0ca;
      --accent: #7bdcc8;
      --coral: #ff735c;
      --background: #082923;
      --panel: #103c34;
      --line: rgba(185, 208, 202, .22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% -15%, #164b40 0, var(--background) 58%);
      color: var(--ink);
      font-family: Arial, "Helvetica Neue", sans-serif;
    }
    .shell { width: min(1320px, 100%); margin: 0 auto; padding: 20px 28px 26px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: 17px; font-weight: 700; text-decoration: none; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 9px; color: var(--background); background: var(--accent); font-size: 14px; }
    .eyebrow { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .stage { overflow: hidden; width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 16px; background: #f4f8f6; box-shadow: 0 24px 80px rgba(0,0,0,.28); }
    .slide { display: none; width: 100%; height: 100%; object-fit: contain; }
    .slide.is-active { display: block; }
    .controls { display: grid; grid-template-columns: 1fr minmax(120px, 300px) 1fr; align-items: center; gap: 18px; margin-top: 18px; }
    .control-group { display: flex; align-items: center; gap: 10px; }
    .control-group:last-child { justify-content: flex-end; }
    button { min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .counter { min-width: 62px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
    .progress { height: 3px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .progress-fill { width: 12.5%; height: 100%; background: var(--accent); transition: width .2s ease; }
    .hint { margin: 15px 0 0; color: var(--muted); text-align: center; font-size: 13px; }
    .hint kbd { padding: 2px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); font: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 640px) {
      .shell { padding: 14px 12px 22px; }
      .topbar { margin-bottom: 12px; }
      .eyebrow { font-size: 11px; text-align: right; }
      .stage { border-radius: 9px; }
      .controls { grid-template-columns: auto 1fr auto; gap: 8px; margin-top: 12px; }
      .control-group { gap: 6px; }
      button { min-height: 42px; padding: 0 10px; font-size: 12px; }
      .control-group:last-child button:first-child { display: none; }
      .counter { font-size: 13px; }
      .hint { font-size: 12px; line-height: 1.5; }
    }
    @media print {
      @page { size: landscape; margin: 0; }
      :root { color-scheme: light; }
      body { min-height: 0; background: white; }
      .shell { width: 100%; max-width: none; margin: 0; padding: 0; }
      .topbar, .controls, .hint { display: none !important; }
      .stage { width: 100%; height: 100vh; overflow: visible; border: 0; border-radius: 0; box-shadow: none; aspect-ratio: auto; background: white; }
      .slide, .slide.is-active { display: block !important; width: 100%; height: 100vh; object-fit: contain; break-after: page; page-break-after: always; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="MedTekser сайтына оралу"><span class="brand-mark" aria-hidden="true">M</span><span>MedTekser</span></a>
      <span class="eyebrow">Жоба презентациясы · Шымкент</span>
    </header>
    <section id="stage" class="stage" aria-label="MedTekser презентация слайдтары">
      <img class="slide is-active" src="./presentation/slide-01.png" alt="1-слайд: MedTekser корпоративтік медтексеру сервисі" fetchpriority="high">
      <img class="slide" src="./presentation/slide-02.png" alt="2-слайд: Өтінімге қажет деректер" loading="lazy">
      <img class="slide" src="./presentation/slide-03.png" alt="3-слайд: Компанияға арналған өтінім беті" loading="lazy">
      <img class="slide" src="./presentation/slide-04.png" alt="4-слайд: Өтінімнің төрт кезеңі" loading="lazy">
      <img class="slide" src="./presentation/slide-05.png" alt="5-слайд: Сұрау қабылданатын бағыттар" loading="lazy">
      <img class="slide" src="./presentation/slide-06.png" alt="6-слайд: Деректерге ұқыпты қарау" loading="lazy">
      <img class="slide" src="./presentation/slide-07.png" alt="7-слайд: Жобаның қазіргі дайындық күйі" loading="lazy">
      <img class="slide" src="./presentation/slide-08.png" alt="8-слайд: Іске қосу үшін қажет үш шешім" loading="lazy">
    </section>
    <nav class="controls" aria-label="Слайдтарды басқару">
      <div class="control-group"><button id="prev" type="button" aria-label="Алдыңғы слайд">← Алдыңғы</button><span id="counter" class="counter" aria-live="polite">1 / 8</span></div>
      <div class="progress" role="progressbar" aria-label="Презентация барысы" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1"><div id="progressFill" class="progress-fill"></div></div>
      <div class="control-group"><button id="fullscreen" type="button">Толық экран</button><button id="next" type="button" aria-label="Келесі слайд">Келесі →</button></div>
    </nav>
    <p class="hint"><kbd>←</kbd> <kbd>→</kbd> пернелерімен ауыстырыңыз · Толық экран үшін <kbd>F</kbd> басыңыз</p>
  </main>
  <script>
    (() => {
      const slides = Array.from(document.querySelectorAll(".slide"));
      const counter = document.getElementById("counter");
      const progress = document.querySelector(".progress");
      const progressFill = document.getElementById("progressFill");
      const stage = document.getElementById("stage");
      let current = Math.min(slides.length - 1, Math.max(0, Number(location.hash.slice(2)) - 1 || 0));
      function show(index) {
        current = (index + slides.length) % slides.length;
        slides.forEach((slide, i) => slide.classList.toggle("is-active", i === current));
        counter.textContent = `${current + 1} / ${slides.length}`;
        progressFill.style.width = `${((current + 1) / slides.length) * 100}%`;
        progress.setAttribute("aria-valuenow", String(current + 1));
        history.replaceState(null, "", `#s${current + 1}`);
      }
      document.getElementById("prev").addEventListener("click", () => show(current - 1));
      document.getElementById("next").addEventListener("click", () => show(current + 1));
      document.getElementById("fullscreen").addEventListener("click", async () => {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await stage.requestFullscreen?.();
      });
      document.addEventListener("keydown", event => {
        if (["ArrowRight", "PageDown", " "].includes(event.key)) { event.preventDefault(); show(current + 1); }
        if (["ArrowLeft", "PageUp"].includes(event.key)) { event.preventDefault(); show(current - 1); }
        if (event.key.toLowerCase() === "f") document.getElementById("fullscreen").click();
        if (event.key === "Home") show(0);
        if (event.key === "End") show(slides.length - 1);
      });
      show(current);
    })();
  </script>
</body>
</html>
